name: Setup app

on:
  workflow_dispatch:
  push:
    paths:
      - "setup-app/**"
      - ".github/workflows/setup-app.yml"
      - "release-tools/**"
  pull_request:
    paths:
      - "setup-app/**"
      - ".github/workflows/setup-app.yml"
      - "release-tools/**"

permissions:
  contents: read

env:
  RELEASE_TAG: v1.0.3
  RELEASE_ARCHIVE: stardew-valley-miyoo-mini-v1.0.3.tar.gz
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: macOS ARM64
            runner: macos-15
          - name: macOS Intel
            runner: macos-15-intel
          - name: Linux x64
            runner: ubuntu-22.04
          - name: Linux ARM64
            runner: ubuntu-22.04-arm

    defaults:
      run:
        working-directory: setup-app

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: setup-app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Check release scripts
        if: runner.os == 'Linux'
        run: |
          shellcheck -e SC1091 scripts/*.sh ../release-tools/prepare.sh ../release-tools/scripts/*.sh ../release-tools/tests/*.sh
          sh ../release-tools/tests/serializer-temp-dir.sh
          sh ../release-tools/tests/gamefile-validation.sh
      - run: pnpm tauri build --no-bundle

  package:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    permissions:
      contents: write
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            bundles: nsis
            artifacts: setup-app/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS ARM64
            runner: macos-15
            bundles: dmg
            artifacts: setup-app/src-tauri/target/release/bundle/dmg/*.dmg
          - name: macOS Intel
            runner: macos-15-intel
            bundles: dmg
            artifacts: setup-app/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux x64
            runner: ubuntu-22.04
            bundles: deb,appimage
            artifacts: |
              setup-app/src-tauri/target/release/bundle/deb/*.deb
              setup-app/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            bundles: deb,appimage
            artifacts: |
              setup-app/src-tauri/target/release/bundle/deb/*.deb
              setup-app/src-tauri/target/release/bundle/appimage/*.AppImage

    defaults:
      run:
        working-directory: setup-app

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: setup-app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: pnpm install --frozen-lockfile
      - name: Download port archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "../releases/$RELEASE_TAG"
          gh release download "$RELEASE_TAG" --clobber --pattern "$RELEASE_ARCHIVE" --dir "../releases/$RELEASE_TAG"
      - run: pnpm stage:release
      - name: Prepare AppImage tools
        if: runner.os == 'Linux'
        run: sh scripts/prepare-appimage-tools.sh
      - run: pnpm tauri build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
      - name: Check AppImage libraries
        if: runner.os == 'Linux'
        run: |
          for appimage in src-tauri/target/release/bundle/appimage/*.AppImage; do
            sh scripts/check-appimage.sh "$appimage"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: setup-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: setup-*
          path: dist
          merge-multiple: true
      - name: Add setup apps to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          setup-app/scripts/collect-installers.sh dist release-assets "$RELEASE_TAG"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber --pattern "$RELEASE_ARCHIVE" --dir release-assets
          (cd release-assets && sha256sum *.AppImage *.deb *.dmg *.exe "$RELEASE_ARCHIVE" > SHA256SUMS)
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            release-assets/*.AppImage release-assets/*.deb release-assets/*.dmg \
            release-assets/*.exe release-assets/SHA256SUMS
