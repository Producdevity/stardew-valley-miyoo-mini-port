name: Setup app

on:
  workflow_dispatch:
  push:
    paths:
      - "VERSION"
      - "setup-app/**"
      - ".github/workflows/setup-app.yml"
      - "release-tools/**"
  pull_request:
    paths:
      - "VERSION"
      - "setup-app/**"
      - ".github/workflows/setup-app.yml"
      - "release-tools/**"

permissions:
  contents: read

jobs:
  release_archive:
    name: Port archive
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      archive: ${{ steps.release.outputs.archive }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Read release metadata
        id: release
        run: node setup-app/scripts/release-metadata.mjs --github-output
      - name: Download port archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ARCHIVE: ${{ steps.release.outputs.archive }}
          RELEASE_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          mkdir -p release-archive
          gh release download "$RELEASE_TAG" --clobber --pattern "$RELEASE_ARCHIVE" --dir release-archive
          echo "$RELEASE_SHA256  release-archive/$RELEASE_ARCHIVE" | sha256sum --check --strict
      - uses: actions/upload-artifact@v7
        with:
          name: port-archive
          path: release-archive/${{ steps.release.outputs.archive }}
          if-no-files-found: error
          retention-days: 1

  build:
    needs: release_archive
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || needs.release_archive.result == 'success') }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            bundles: nsis
            artifacts: setup-app/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS ARM64
            runner: macos-15
            bundles: dmg
            artifacts: setup-app/src-tauri/target/release/bundle/dmg/*.dmg
          - name: macOS Intel
            runner: macos-15-intel
            bundles: dmg
            artifacts: setup-app/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux x64
            runner: ubuntu-22.04
            bundles: deb,appimage
            artifacts: |
              setup-app/src-tauri/target/release/bundle/deb/*.deb
              setup-app/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            bundles: deb,appimage
            artifacts: |
              setup-app/src-tauri/target/release/bundle/deb/*.deb
              setup-app/src-tauri/target/release/bundle/appimage/*.AppImage

    defaults:
      run:
        working-directory: setup-app

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: setup-app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm release:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Check portable file copy
        shell: bash
        run: sh ../release-tools/tests/copy-tree.sh
      - name: Check release scripts
        if: runner.os == 'Linux'
        run: |
          shellcheck -e SC1091 scripts/*.sh ../release-tools/prepare.sh ../release-tools/scripts/*.sh ../release-tools/tests/*.sh
          sh ../release-tools/tests/serializer-temp-dir.sh
          sh ../release-tools/tests/gamefile-validation.sh
      - name: Check app build
        if: github.event_name != 'workflow_dispatch'
        run: pnpm tauri build --no-bundle
      - name: Download port archive
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v8
        with:
          name: port-archive
          path: releases/${{ needs.release_archive.outputs.tag }}
      - name: Stage port archive
        if: github.event_name == 'workflow_dispatch'
        run: pnpm stage:release
      - name: Prepare AppImage tools
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        run: sh scripts/prepare-appimage-tools.sh
      - name: Build installer
        if: github.event_name == 'workflow_dispatch'
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
      - name: Check AppImage libraries
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        run: |
          for appimage in src-tauri/target/release/bundle/appimage/*.AppImage; do
            sh scripts/check-appimage.sh "$appimage"
          done
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: setup-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [release_archive, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: setup-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: port-archive
          path: release-assets
      - name: Add setup apps to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_archive.outputs.tag }}
          RELEASE_ARCHIVE: ${{ needs.release_archive.outputs.archive }}
        run: |
          setup-app/scripts/collect-installers.sh dist release-assets "$RELEASE_TAG"
          (cd release-assets && sha256sum -- *.AppImage *.deb *.dmg *.exe "$RELEASE_ARCHIVE" > SHA256SUMS)
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            release-assets/*.AppImage release-assets/*.deb release-assets/*.dmg \
            release-assets/*.exe release-assets/SHA256SUMS
