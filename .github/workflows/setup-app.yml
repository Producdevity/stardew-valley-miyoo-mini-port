name: Setup app

on:
  workflow_dispatch:
  push:
    paths:
      - "setup-app/**"
      - ".github/workflows/setup-app.yml"
      - "release-tools/**"
  pull_request:
    paths:
      - "setup-app/**"
      - ".github/workflows/setup-app.yml"
      - "release-tools/**"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: macOS ARM64
            runner: macos-15
          - name: macOS Intel
            runner: macos-15-intel
          - name: Linux x64
            runner: ubuntu-22.04
          - name: Linux ARM64
            runner: ubuntu-22.04-arm

    defaults:
      run:
        working-directory: setup-app

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: setup-app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Check release scripts
        if: runner.os == 'Linux'
        run: |
          shellcheck -e SC1091 ../release-tools/prepare.sh ../release-tools/scripts/*.sh ../release-tools/tests/*.sh
          sh ../release-tools/tests/serializer-temp-dir.sh
      - run: pnpm tauri build --no-bundle

  package:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            bundles: nsis
            artifacts: setup-app/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS ARM64
            runner: macos-15
            bundles: dmg
            artifacts: setup-app/src-tauri/target/release/bundle/dmg/*.dmg
          - name: macOS Intel
            runner: macos-15-intel
            bundles: dmg
            artifacts: setup-app/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux x64
            runner: ubuntu-22.04
            bundles: deb,appimage
            artifacts: |
              setup-app/src-tauri/target/release/bundle/deb/*.deb
              setup-app/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            bundles: deb,appimage
            artifacts: |
              setup-app/src-tauri/target/release/bundle/deb/*.deb
              setup-app/src-tauri/target/release/bundle/appimage/*.AppImage

    defaults:
      run:
        working-directory: setup-app

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: setup-app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Download port archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "require('fs').mkdirSync('../releases/v1.0.1', { recursive: true })"
          gh release download v1.0.1 --clobber --pattern stardew-valley-miyoo-mini-v1.0.1.tar.gz --dir ../releases/v1.0.1
      - run: pnpm stage:release
      - run: pnpm tauri build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
